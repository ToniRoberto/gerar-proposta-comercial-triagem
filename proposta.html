<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Proposta Comercial — Pátio Triagem</title>
    <style>
        :root {
            --ink: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --accent: #15803d;
            --blue: #2563eb;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Segoe UI", Inter, Georgia, serif;
            color: var(--ink);
            line-height: 1.55;
            font-size: 11pt;
        }
        .doc { max-width: 780px; margin: 0 auto; padding: 2rem 2.25rem 3rem; }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
            font-family: "Segoe UI", sans-serif;
        }
        .toolbar a, .toolbar button {
            padding: 0.5rem 0.85rem;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            text-decoration: none;
            border: 1px solid var(--border);
            background: #fff;
            color: var(--ink);
            cursor: pointer;
            font-family: inherit;
        }
        .toolbar .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .empty {
            text-align: center;
            padding: 3rem 1rem;
            font-family: "Segoe UI", sans-serif;
        }
        .empty p { color: var(--muted); max-width: 28rem; margin: 0.5rem auto 1rem; }
        .letterhead {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }
        .letterhead h1 {
            margin: 0;
            font-size: 1.35rem;
            font-family: "Segoe UI", sans-serif;
        }
        .letterhead .meta {
            text-align: right;
            font-size: 0.82rem;
            color: var(--muted);
            font-family: "Segoe UI", sans-serif;
        }
        .field { margin-bottom: 1rem; font-size: 0.9rem; }
        .field label {
            display: block;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--muted);
            margin-bottom: 0.15rem;
        }
        .client-panel {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem 1.15rem 0.35rem;
            margin-bottom: 1.25rem;
            font-family: "Segoe UI", sans-serif;
        }
        .client-panel__head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.85rem;
        }
        .client-panel__head h2 {
            margin: 0;
            border: none;
            padding: 0;
            font-size: 0.95rem;
        }
        .save-status { font-size: 0.72rem; color: var(--muted); white-space: nowrap; }
        .save-status.is-saved { color: #15803d; }
        .client-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 1rem;
        }
        .client-grid .field--full { grid-column: 1 / -1; }
        .field-input {
            width: 100%;
            border: none;
            border-bottom: 1px solid #cbd5e1;
            background: #fff;
            padding: 0.35rem 0.15rem;
            font: inherit;
            color: var(--ink);
        }
        .field-input:focus {
            outline: none;
            border-bottom-color: var(--blue);
        }
        .field-input::placeholder { color: #94a3b8; }
        .field-input--inline {
            display: inline-block;
            width: auto;
            min-width: 5rem;
            max-width: 8rem;
            font-weight: 700;
            text-align: center;
        }
        .meta-input-wrap { display: inline-flex; align-items: baseline; gap: 0.25rem; }
        .sig-field { margin-top: 0.45rem; display: flex; align-items: baseline; gap: 0.35rem; }
        .sig-field span { flex: 0 0 auto; font-size: 0.82rem; }
        .sig-field .field-input { flex: 1; min-width: 0; }
        .sig-value {
            flex: 1;
            font-weight: 600;
            border-bottom: 1px solid var(--border);
            padding: 0.2rem 0;
            min-height: 1.35rem;
        }
        .sig-value.is-empty { color: var(--muted); font-weight: 400; }
        @media (max-width: 640px) { .client-grid { grid-template-columns: 1fr; } }
        h2 {
            font-family: "Segoe UI", sans-serif;
            font-size: 1rem;
            margin: 1.5rem 0 0.6rem;
            color: var(--blue);
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.25rem;
        }
        p { margin: 0.5rem 0; }
        ul { margin: 0.4rem 0; padding-left: 1.25rem; }
        li { margin-bottom: 0.25rem; }
        .highlight {
            background: #ecfdf5;
            border: 1px solid #86efac;
            border-radius: 10px;
            padding: 1rem 1.15rem;
            margin: 1rem 0;
            font-family: "Segoe UI", sans-serif;
        }
        .highlight--muted {
            background: #f8fafc;
            border-color: var(--border);
        }
        .highlight .price { font-size: 1.5rem; font-weight: 800; color: var(--accent); }
        .highlight .alt { font-size: 0.88rem; color: var(--muted); margin-top: 0.35rem; }
        .badge-selected {
            display: inline-block;
            background: var(--blue);
            color: #fff;
            font-size: 0.68rem;
            font-weight: 700;
            padding: 0.15rem 0.45rem;
            border-radius: 999px;
            margin-left: 0.35rem;
            vertical-align: middle;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
            font-family: "Segoe UI", sans-serif;
            margin: 0.75rem 0;
        }
        th, td {
            border: 1px solid var(--border);
            padding: 0.45rem 0.6rem;
            text-align: left;
        }
        th { background: #f8fafc; font-weight: 600; }
        .timeline td:first-child { width: 18%; font-weight: 600; white-space: nowrap; }
        .invest-table td:last-child { text-align: right; font-weight: 600; white-space: nowrap; }
        .signatures {
            max-width: 420px;
            margin-top: 2.5rem;
            font-family: "Segoe UI", sans-serif;
            font-size: 0.88rem;
        }
        .sig-line { border-top: 1px solid var(--ink); margin-top: 2.5rem; padding-top: 0.35rem; }
        .print-hint {
            background: #ecfdf5;
            border-radius: 8px;
            padding: 0.6rem 0.85rem;
            font-size: 0.82rem;
            font-family: "Segoe UI", sans-serif;
            margin-bottom: 1rem;
        }
        footer {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: var(--muted);
            border-top: 1px solid var(--border);
            padding-top: 0.75rem;
        }
        @media print {
            .toolbar, .print-hint, .empty, .client-panel__head .save-status { display: none !important; }
            .doc { padding: 0.75rem; }
            .client-panel { background: transparent; border: none; padding: 0; }
            .field-input { background: transparent !important; border-bottom: 1px solid #cbd5e1 !important; }
            .field-input::placeholder { color: transparent; }
        }
    </style>
</head>
<body>
<div id="app"></div>
<script src="comercial-shared.js"></script>
<script>
(function () {
    var app = document.getElementById('app');
    if (!window.ComercialShared) {
        app.innerHTML = '<div class="empty"><p>Não foi possível carregar os dados. Abra via <strong>http://localhost/patio_triagem/docs/comercial/</strong></p><a href="index.html">Voltar ao comparativo</a></div>';
        return;
    }
    var CS = window.ComercialShared;

    function esc(s) {
        return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function attrEsc(s) {
        return esc(s).replace(/'/g, '&#39;');
    }

    function renderEmpty() {
        app.innerHTML =
            '<div class="empty">' +
            '<h1 style="font-family:Segoe UI,sans-serif;margin:0 0 0.5rem">Proposta comercial</h1>' +
            '<p>Seleccione um plano e add-ons no comparativo para gerar a proposta automaticamente.</p>' +
            '<a href="index.html" style="display:inline-block;padding:0.65rem 1.1rem;background:#15803d;color:#fff;border-radius:10px;text-decoration:none;font-weight:700;font-family:Segoe UI,sans-serif">Ir ao comparativo de planos</a>' +
            '</div>';
    }

    function clientField(client, key, label, opts) {
        opts = opts || {};
        var val = client && client[key] ? attrEsc(client[key]) : '';
        var cls = 'field' + (opts.full ? ' field--full' : '');
        var type = opts.type || 'text';
        return (
            '<div class="' + cls + '">' +
            '<label for="client-' + key + '">' + esc(label) + '</label>' +
            '<input class="field-input" id="client-' + key + '" type="' + type + '" ' +
            'data-client-field="' + key + '" value="' + val + '" placeholder="' + attrEsc(opts.placeholder || '') + '"' +
            (opts.required ? ' required' : '') + '>' +
            '</div>'
        );
    }

    function displaySignName(client) {
        return (client.businessName || client.contactName || '').trim() || '—';
    }

    function displaySignDoc(client) {
        return (client.document || '').trim() || '—';
    }

    function bindClientForm(currentState) {
        var saveStatus = document.getElementById('save-status');
        var saveTimer = null;

        function syncSignature() {
            var business = document.getElementById('client-businessName');
            var contact = document.getElementById('client-contactName');
            var docInput = document.getElementById('client-document');
            var sigName = document.getElementById('sig-name');
            var sigDoc = document.getElementById('sig-document');
            if (sigName) {
                var name = (business && business.value.trim()) || (contact && contact.value.trim()) || '—';
                sigName.textContent = name;
                sigName.classList.toggle('is-empty', name === '—');
            }
            if (sigDoc && docInput) {
                var doc = docInput.value.trim() || '—';
                sigDoc.textContent = doc;
                sigDoc.classList.toggle('is-empty', doc === '—');
            }
        }

        function markSaved() {
            if (!saveStatus) return;
            saveStatus.textContent = 'Dados guardados ✓';
            saveStatus.classList.add('is-saved');
            clearTimeout(saveTimer);
            saveTimer = setTimeout(function () {
                saveStatus.textContent = 'Gravação automática activa';
                saveStatus.classList.remove('is-saved');
            }, 2200);
        }

        app.querySelectorAll('[data-client-field]').forEach(function (input) {
            var key = input.getAttribute('data-client-field');
            input.addEventListener('input', function () {
                currentState = CS.updateClient(currentState, (function () {
                    var patch = {};
                    patch[key] = input.value;
                    return patch;
                })()) || currentState;
                markSaved();
                syncSignature();
            });
        });

        syncSignature();

        var btnPrint = document.getElementById('btn-print');
        if (btnPrint) {
            btnPrint.addEventListener('click', function () {
                var business = document.getElementById('client-businessName');
                if (business && !business.value.trim()) {
                    business.focus();
                    if (saveStatus) {
                        saveStatus.textContent = 'Preencha o nome do cliente / unidade';
                        saveStatus.classList.remove('is-saved');
                    }
                    return;
                }
                window.print();
            });
        }
    }

    function renderProposal(state) {
        var data = CS.compute(state);
        if (!data) {
            renderEmpty();
            return;
        }

        var plan = data.plan;
        var scope = CS.getScope(data.planId);
        var implRows = CS.getImplementationRows(data.planId, data.addons);
        var unselectedAddons = CS.getUnselectedAddons(data.planId, data.addons);
        var limitations = CS.getLimitations(data.planId, data.addons);
        var datePt = CS.formatDatePt(data.generatedAt);
        var client = state.client || CS.normalizeClient({});
        var premises = CS.getClientPremises();

        var scopeHtml = scope.map(function (item) {
            return '<li>' + item + '</li>';
        }).join('');

        var implHtml = implRows.map(function (row) {
            return '<tr><td>' + row[0] + '</td><td>' + row[1] + '</td></tr>';
        }).join('');

        var investLines = data.lines.filter(function (l) {
            return l.kind !== 'plan';
        }).map(function (l) {
            return '<tr><td>' + esc(l.label) + '</td><td>' + esc(l.value) + '</td></tr>';
        }).join('');

        investLines +=
            '<tr><td><strong>Investimento inicial</strong></td><td><strong>' + CS.money(data.initial) + '</strong></td></tr>';
        if (data.recurring > 0) {
            investLines += '<tr><td>Recorrente (mensal)</td><td>' + CS.moneyDec(data.recurring) + '/mês</td></tr>';
        }
        if (data.annualExtra > 0) {
            investLines += '<tr><td>Add-ons anuais</td><td>' + CS.money(data.annualExtra) + '/ano</td></tr>';
        }
        investLines += '<tr><td><strong>Total estimado (1.º ano)</strong></td><td><strong>' + CS.money(Math.round(data.year1)) + '</strong></td></tr>';

        var addonsContracted = '';
        if (data.addons.length) {
            addonsContracted =
                '<h2>6. Add-ons contratados</h2>' +
                '<ul>' + data.addons.map(function (a) {
                    return '<li>' + esc(a.name) + ' — <strong>' + esc(a.label) + '</strong></li>';
                }).join('') + '</ul>';
        }

        var optionalAddons = '';
        var optSection = data.addons.length ? 7 : 6;
        if (unselectedAddons.length) {
            optionalAddons =
                '<h2>' + optSection + '. Opcionais não incluídos</h2>' +
                '<ul>' + unselectedAddons.map(function (a) {
                    return '<li>' + esc(a.name) + ' — <strong>' + esc(a.label) + '</strong></li>';
                }).join('') +
                '<li>ERP / TMS, app mobile de portaria, notificações WhatsApp</li>' +
                '<li>Hardware (balança, cancela, leitores de placa)</li>' +
                '</ul>';
        } else {
            optionalAddons =
                '<h2>' + optSection + '. Não incluído</h2>' +
                '<ul>' +
                '<li>ERP / TMS, app mobile de portaria, notificações WhatsApp</li>' +
                '<li>Hardware (balança, cancela, leitores de placa)</li>' +
                '</ul>';
        }

        var sectionOffset = data.addons.length ? 1 : 0;
        var paySection = 6 + sectionOffset;
        var premSection = paySection + 1;
        var limSection = premSection + 1;
        var aceiteSection = limSection + 1;

        var billingPrimary = '';
        var billingSecondary = '';
        var setupNet = CS.applyPlanDiscount(plan.setup, data.planId);
        var monthlyNet = CS.applyPlanDiscount(plan.monthly, data.planId);
        var annualNet = CS.applyPlanDiscount(plan.annual, data.planId);
        var discountNote = data.corporateDiscount
            ? ' · <strong>10% desconto Corporativo</strong> (−' + CS.money(data.discountPlanTotal) + ' no 1.º ano do plano)'
            : '';

        if (data.billing === 'monthly') {
            billingPrimary =
                '<div class="highlight">' +
                '<div><strong>Forma de cobrança seleccionada — Mensal</strong> <span class="badge-selected">Simulador</span></div>' +
                '<div class="price">' + CS.moneyDec(setupNet) + ' + ' + CS.moneyDec(data.recurring) + '/mês</div>' +
                '<div class="alt">Implantação (única) + mensalidade' +
                (data.addons.length ? ' + add-ons' : '') +
                ' · investimento inicial: <strong>' + CS.money(data.initial) + '</strong>' +
                discountNote + '</div></div>';
            billingSecondary =
                '<div class="highlight highlight--muted">' +
                '<div><strong>Alternativa — Licença anual</strong></div>' +
                '<div class="price" style="color:var(--blue);font-size:1.25rem">' + CS.moneyDec(annualNet) + '/ano</div>' +
                '<div class="alt">Equivalente a ~' + CS.moneyDec(annualNet / 10) + '/mês no plano</div></div>';
        } else {
            billingPrimary =
                '<div class="highlight">' +
                '<div><strong>Forma de cobrança seleccionada — Anual</strong> <span class="badge-selected">Simulador</span></div>' +
                '<div class="price" style="color:var(--blue)">' + CS.moneyDec(annualNet) + '/ano</div>' +
                '<div class="alt">10 mensalidades em pagamento único + add-ons · inicial: <strong>' + CS.money(data.initial) + '</strong>' +
                discountNote + '</div></div>';
            billingSecondary =
                '<div class="highlight highlight--muted">' +
                '<div><strong>Alternativa — Implantação + mensalidade</strong></div>' +
                '<div class="price">' + CS.moneyDec(setupNet) + ' + ' + CS.moneyDec(monthlyNet) + '/mês</div>' +
                '<div class="alt">Modelo híbrido com suporte mensal</div></div>';
        }

        var premisesHtml = premises.map(function (p) {
            return '<li>' + esc(p) + '</li>';
        }).join('');

        app.innerHTML =
            '<div class="doc">' +
            '<div class="toolbar">' +
            '<button type="button" class="btn-primary" id="btn-print">Imprimir / PDF</button>' +
            '<a href="index.html">← Ajustar no comparativo</a>' +
            '<span class="save-status" id="save-status">Gravação automática activa</span>' +
            '</div>' +
            '<p class="print-hint">Preencha os dados do cliente — gravados automaticamente. Depois <strong>Imprimir / PDF</strong> (Ctrl+P).</p>' +
            '<div class="letterhead">' +
            '<div><h1>Proposta Comercial</h1>' +
            '<p style="margin:0.25rem 0 0;font-size:0.95rem;color:var(--muted)">Pátio Triagem — Plano ' + esc(plan.name) + '</p></div>' +
            '<div class="meta">' +
            '<div class="meta-input-wrap">Proposta n.º <input class="field-input field-input--inline" id="client-proposalNumber" type="text" data-client-field="proposalNumber" value="' + attrEsc(client.proposalNumber) + '" placeholder="001/2026"></div>' +
            '<div>Validade: <strong>30 dias</strong></div>' +
            '<div>Data: <strong>' + esc(datePt) + '</strong></div>' +
            '</div></div>' +
            '<section class="client-panel" aria-label="Dados do cliente">' +
            '<div class="client-panel__head"><h2>Dados do cliente</h2></div>' +
            '<div class="client-grid">' +
            clientField(client, 'businessName', 'Cliente / Unidade de recebimento', { full: true, placeholder: 'Ex.: Terminal Grãos Tapajós', required: true }) +
            clientField(client, 'contactName', 'Contacto / Responsável', { placeholder: 'Ex.: Maria Santos' }) +
            clientField(client, 'phone', 'Telefone / WhatsApp', { type: 'tel', placeholder: '(93) 99999-9999' }) +
            clientField(client, 'email', 'E-mail', { type: 'email', placeholder: 'operacao@cliente.com.br' }) +
            clientField(client, 'document', 'CNPJ', { placeholder: '00.000.000/0001-00' }) +
            clientField(client, 'city', 'Cidade / UF', { placeholder: 'Santarém — PA' }) +
            clientField(client, 'address', 'Endereço da unidade', { full: true, placeholder: 'Rodovia, km, pátio de triagem' }) +
            '</div></section>' +
            '<h2>1. Objeto</h2>' +
            '<p>Fornecimento, implementação e suporte do <strong>Pátio Triagem</strong> (gestão e cobrança de pátio para caminhões de grãos), conforme o <strong>Plano ' + esc(plan.name) + '</strong> e itens seleccionados.' + esc(CS.getObjetoExtra(data.planId)) + '</p>' +
            '<h2>2. Escopo incluído (Plano ' + esc(plan.name) + ')</h2>' +
            '<ul>' + scopeHtml + '</ul>' +
            '<h2>3. Serviços de implementação</h2>' +
            '<table><thead><tr><th>Entrega</th><th>Detalhe</th></tr></thead><tbody>' + implHtml + '</tbody></table>' +
            '<h2>4. Cronograma (' + esc(plan.timeline) + ')</h2>' +
            '<table class="timeline"><thead><tr><th>Fase</th><th>Actividades</th><th>Duração</th></tr></thead><tbody>' + CS.getTimelineRows(data.planId) + '</tbody></table>' +
            '<p style="font-size:0.85rem;color:var(--muted)">Prazo após recepção do sinal e credenciais TBL (quando aplicável).</p>' +
            '<h2>5. Investimento</h2>' +
            billingPrimary + billingSecondary +
            '<table class="invest-table"><thead><tr><th>Item</th><th>Valor</th></tr></thead><tbody>' + investLines + '</tbody></table>' +
            addonsContracted + optionalAddons +
            '<h2>' + paySection + '. Condições de pagamento</h2>' +
            '<table><tbody>' +
            '<tr><td>Sinal na aceitação</td><td><strong>50%</strong> da implantação (' + CS.money(Math.round(data.initial * 0.5)) + ')*</td></tr>' +
            '<tr><td>Go-live</td><td><strong>50%</strong> restante da implantação (' + CS.money(Math.round(data.initial * 0.5)) + ')*</td></tr>' +
            (data.recurring > 0 ? '<tr><td>Mensalidade recorrente</td><td><strong>' + CS.moneyDec(data.recurring) + '/mês</strong>, após go-live</td></tr>' : '') +
            '</tbody></table>' +
            '<p style="font-size:0.8rem;color:var(--muted)">* Quando a implantação for paga em modelo mensal; licença anual pode ser à vista conforme acordo.</p>' +
            '<h2>' + premSection + '. Premissas e responsabilidades do cliente</h2>' +
            '<ul>' + premisesHtml + '</ul>' +
            '<h2>' + limSection + '. Limitações técnicas acordadas</h2>' +
            '<p>' + esc(limitations) + '</p>' +
            '<h2>' + aceiteSection + '. Aceite</h2>' +
            '<p>O cliente declara concordar com escopo, valores e cronograma, incluindo plano <strong>' + esc(plan.name) + '</strong>' +
            (data.addons.length ? ' e add-ons da secção 6' : '') + '.</p>' +
            '<div class="signatures">' +
            '<div class="sig-line">Cliente / Unidade</div>' +
            '<div class="sig-field"><span>Nome:</span><span class="sig-value' + (displaySignName(client) === '—' ? ' is-empty' : '') + '" id="sig-name">' + esc(displaySignName(client)) + '</span></div>' +
            '<div class="sig-field"><span>CNPJ:</span><span class="sig-value' + (displaySignDoc(client) === '—' ? ' is-empty' : '') + '" id="sig-document">' + esc(displaySignDoc(client)) + '</span></div>' +
            '</div>' +
            '<footer>Proposta comercial — Pátio Triagem · Plano ' + esc(plan.name) +
            (client.businessName ? ' · ' + esc(client.businessName) : '') +
            ' · Valores em R$ (BRL). Validade 30 dias.</footer>' +
            '</div>';

        document.title = 'Proposta — Pátio Triagem' + (client.businessName ? ' — ' + client.businessName : ' — ' + plan.name);
        bindClientForm(state);
    }

    var params = new URLSearchParams(window.location.search);
    var planFromUrl = params.get('plan');

    var state = null;
    if (planFromUrl && CS.PLANS[planFromUrl]) {
        state = CS.normalizeState({
            plan: planFromUrl,
            billing: params.get('billing') || 'monthly',
            addons: (params.get('addons') || '').split(',').filter(Boolean)
        });
        if (state) CS.saveState(state);
    } else {
        state = CS.loadState();
    }

    if (state) {
        renderProposal(state);
    } else {
        renderEmpty();
    }
})();
</script>
</body>
</html>
